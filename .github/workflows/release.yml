name: Release

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Resolve version and check tag
        id: version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            # Manually pushed tag: always release it
            TAG="${GITHUB_REF_NAME}"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            VERSION=$(sed -n 's/.*versionName *= *"\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)
            if [ -z "$VERSION" ]; then
              echo "::error::versionName not found in app/build.gradle.kts"
              exit 1
            fi
            TAG="v${VERSION}"
            if [ "${GITHUB_REF_NAME}" != "main" ]; then
              # Manual run on a feature branch: snapshot prerelease, never clashes with real tags
              SLUG=$(echo "${GITHUB_REF_NAME}" | tr -c 'A-Za-z0-9\n' '-' | cut -c1-40)
              TAG="${TAG}-${SLUG}.${GITHUB_RUN_NUMBER}"
            fi
            if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
              echo "Tag ${TAG} already exists - nothing to release."
              echo "skip=true" >> "$GITHUB_OUTPUT"
            else
              echo "skip=false" >> "$GITHUB_OUTPUT"
            fi
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Verify signing secrets
        if: steps.version.outputs.skip != 'true'
        run: |
          for v in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!v}" ]; then
              echo "::error::Secret $v is missing or empty - refusing to publish an unsigned APK."
              exit 1
            fi
          done

      - name: Set up JDK 17
        if: steps.version.outputs.skip != 'true'
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        if: steps.version.outputs.skip != 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        if: steps.version.outputs.skip != 'true'
        run: chmod +x gradlew

      - name: Download Gradle wrapper (with retries)
        if: steps.version.outputs.skip != 'true'
        run: |
          for i in 1 2 3 4 5; do
            ./gradlew --version && exit 0
            echo "::warning::Gradle wrapper download failed (attempt $i/5), retrying in $((i*20))s"
            sleep $((i*20))
          done
          exit 1

      - name: Run unit tests
        if: steps.version.outputs.skip != 'true'
        run: ./gradlew testDebugUnitTest

      - name: Decode keystore
        if: steps.version.outputs.skip != 'true'
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/keystore.jks"

      - name: Build release APK (signed)
        if: steps.version.outputs.skip != 'true'
        run: |
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/keystore.jks" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Locate and rename APK
        if: steps.version.outputs.skip != 'true'
        id: apk
        run: |
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          if [ -z "$APK" ]; then
            echo "::error::Release APK not found"
            exit 1
          fi
          case "$APK" in *unsigned*) echo "::error::APK is unsigned: $APK"; exit 1;; esac
          NAME="phone-whisper-${{ steps.version.outputs.tag }}.apk"
          cp "$APK" "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: steps.version.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Phone Whisper ${{ steps.version.outputs.tag }}
          draft: false
          prerelease: ${{ contains(steps.version.outputs.tag, '-') }}
          generate_release_notes: true
          files: ${{ steps.apk.outputs.name }}
